<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpendWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>SpendWise</h1>
            <div class="total-card">
                <span class="label">Total Spending</span>
                <span id="total-amount">$0.00</span>
            </div>
        </header>

        <section class="summary-section">
            <h3>Category Summary</h3>
            <div id="category-summary" class="summary-grid"></div>
        </section>

        <section class="filter-section">
            <select id="filter-category">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </section>

        <main id="expense-list" class="expense-list">
            <!-- Expenses injected here -->
        </main>

        <button id="fab-add" class="fab">+</button>

        <!-- Modal for Adding/Editing -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <h2 id="modal-title">Add Expense</h2>
                <form id="expense-form">
                    <input type="hidden" id="edit-id">
                    <div class="input-group">
                        <label>Amount</label>
                        <input type="number" id="amount" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label>Category</label>
                        <select id="category" required>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <input type="text" id="description" required placeholder="What was it for?">
                    </div>
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="modal-actions">
                        <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
